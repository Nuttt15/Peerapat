<!DOCTYPE html>
<html>
<head>
    <title>เพิ่มเค้ก</title>
    <style>
        body { font-family: Arial; background: #fff0f5; text-align:center; }

        form {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
        }

        input, select {
            margin: 10px;
            padding: 8px;
            width: 200px;
        }

        button {
            background: #ff69b4;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h1>🍰 เพิ่มเค้ก</h1>

<form method="POST">
    <input type="text" name="name" placeholder="ชื่อเค้ก"><br>
    <input type="number" name="price" placeholder="ราคา"><br>
    <input type="text" name="image" placeholder="URL รูป"><br>
    <input type="number" name="stock" placeholder="Stock"><br>

    <select name="category_id">
        {% for c in categories %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
    </select><br>

    <button type="submit">บันทึก</button>
</form>

<br><a href="/">⬅ กลับ</a>

</body>
</html>
