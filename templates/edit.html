<!DOCTYPE html>
<html>
<head>
    <title>แก้ไขเค้ก</title>
    <style>
        body { font-family: Arial; background: #fff0f5; text-align:center; }

        form {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
        }

        input, select {
            margin: 10px;
            padding: 8px;
            width: 200px;
        }

        button {
            background: orange;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h1>✏️ แก้ไขเค้ก</h1>

<form method="POST">
    <input type="text" name="name" value="{{ cake.name }}"><br>
    <input type="number" name="price" value="{{ cake.price }}"><br>
    <input type="text" name="image" value="{{ cake.image }}"><br>
    <input type="number" name="stock" value="{{ cake.stock }}"><br>

    <select name="category_id">
        {% for c in categories %}
        <option value="{{ c.id }}"
        {% if c.id == cake.category_id %} selected {% endif %}>
            {{ c.name }}
        </option>
        {% endfor %}
    </select><br>

    <button type="submit">อัปเดต</button>
</form>

<br><a href="/">⬅ กลับ</a>

</body>
</html>
