<!DOCTYPE html>
<html>
<head>
    <title>Peerapat Cake Shop</title>
    <style>
        body {
            font-family: Arial;
            background-color: #fff0f5;
            text-align: center;
        }

        h1 {
            color: #ff69b4;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin: 15px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        .btn {
            display: inline-block;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
        }

        .edit { background-color: orange; }
        .delete { background-color: red; }
        .add {
            background-color: #ff69b4;
            padding: 10px 20px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <h1>🍰 Peerapat Cake Shop</h1>

    <a href="/add" class="btn add">+ เพิ่มเค้ก</a>

    <div class="container">
        {% for cake in cakes %}
        <div class="card">
            <img src="{{ cake.image }}">
            <h3>{{ cake.name }}</h3>
            <p>💰 {{ cake.price }} บาท</p>
            <p>📦 Stock: {{ cake.stock }}</p>
            <p>🍫 {{ cake.category_name }}</p>

            <a href="/edit/{{ cake.id }}" class="btn edit">Edit</a>
            <a href="/delete/{{ cake.id }}" class="btn delete">Delete</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
